[package]
name = "dsa"
version = "0.1.0"
edition = "2024"

[dependencies]
argon2 = { version = "0.5.3", features = ["std"] }
axum = { version = "0.8.9", features = ["macros"] }
axum-extra = { version = "0.10", features = ["cookie", "typed-header"] }
dotenvy = "0.15"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["trace", "cors", "set-header"] }
sqlx = { version = "0.9.0", features = [
  "runtime-tokio",
  "postgres",
  "uuid",
  "chrono",
  "macros",
  "migrate",
  "tls-rustls",
] }
chrono = { version = "0.4.45", features = ["serde"] }
uuid = { version = "1.24.0", features = ["v7", "serde", "fast-rng"] }
# Required for generic repository traits: native `async fn` in traits breaks
# axum's `Handler` Send bounds via RPITIT lifetime capture (rust-lang/rust#100013),
# so these stay boxed. `CacheStore` uses native async (concrete enum dispatch).
async-trait = "0.1.91"
validator = { version = "0.21.0", features = ["derive"] }
jsonwebtoken = "9.3.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rand = "0.8"
redis = { version = "0.29.5", features = ["tokio-comp", "connection-manager"] }
time = "0.3"
dashmap = "6.1"
